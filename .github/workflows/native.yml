name: Build Yukari Module

on:
  push:
    branches: [main, dev, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yukari-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Native and build infrastructure tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run host validation
        run: bash scripts/build.sh test

      - name: Upload host diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yukari-host-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: out/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  android-build:
    name: Android release and module package
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle and validate Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare SDK, compile and package
        run: bash scripts/build.sh android

      - name: Upload Yukari module
        uses: actions/upload-artifact@v4
        with:
          name: Yukari-${{ github.sha }}-${{ github.run_attempt }}
          path: out/Yukari.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Yukari-android-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            out/diagnostics/
            module/build/outputs/
            module/build/intermediates/cxx/
            module/.cxx/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
