name: Build Yukari Module

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject version info
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN_NUMBER="${{ github.run_number }}"
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          if [ "$BRANCH_NAME" = "dev" ]; then
            sed -i "s/^version=.*/version=1.0.0-dev (${RUN_NUMBER}-${SHORT_SHA})/" module/module.prop
          else
            sed -i "s/^version=.*/version=1.0.0 (${RUN_NUMBER}-${SHORT_SHA})/" module/module.prop
          fi
          sed -i "s/^versionCode=.*/versionCode=${RUN_NUMBER}/" module/module.prop
          echo "Branch: $BRANCH_NAME"
          echo "Version: $(grep '^version=' module/module.prop)"
          cat module/module.prop

      - name: Test native filtering
        run: bash tests/native/run.sh

      - name: Build native library
        run: gradle :module:assembleRelease

      - name: Package Magisk module
        run: bash scripts/package.sh

      - name: Verify module package
        run: |
          test -f out/Yukari.zip
          unzip -l out/Yukari.zip
          unzip -l out/Yukari.zip | grep -q 'module.prop'
          unzip -l out/Yukari.zip | grep -q 'zygisk/arm64-v8a.so'
          unzip -l out/Yukari.zip | grep -q 'action.sh'
          unzip -l out/Yukari.zip | grep -q 'customize.sh'
          unzip -p out/Yukari.zip module.prop | grep -q 'version='
          unzip -p out/Yukari.zip zygisk/arm64-v8a.so > /tmp/yukari.so
          readelf -Ws /tmp/yukari.so | grep -q 'zygisk_module_entry'
          ! readelf -Ws /tmp/yukari.so | grep -q 'zygisk_module_create'

      - name: Upload Yukari module
        uses: actions/upload-artifact@v4
        with:
          name: Yukari-${{ github.sha }}
          path: out/Yukari.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Yukari-native-diagnostics-${{ github.sha }}
          path: |
            module/build/outputs/
            module/build/intermediates/cxx/
            module/build/intermediates/stripped_native_libs/
          if-no-files-found: ignore
          retention-days: 7
