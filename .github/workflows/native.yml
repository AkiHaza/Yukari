name: Build Yukari Module

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release and debug native libraries
        run: gradle :module:assembleRelease :module:assembleDebug

      - name: Package normal Magisk module
        run: bash scripts/package.sh release

      - name: Package debug Magisk module
        run: bash scripts/package.sh debug

      - name: Verify module packages
        run: |
          test -f out/Yukari.zip
          test -f out/Yukari-debug.zip
          unzip -l out/Yukari.zip
          unzip -l out/Yukari-debug.zip
          unzip -l out/Yukari.zip | grep -q 'module.prop'
          unzip -l out/Yukari.zip | grep -q 'zygisk/arm64-v8a.so'
          unzip -l out/Yukari-debug.zip | grep -q 'module.prop'
          unzip -l out/Yukari-debug.zip | grep -q 'zygisk/arm64-v8a.so'
          unzip -p out/Yukari.zip zygisk/arm64-v8a.so > /tmp/yukari.so
          readelf -Ws /tmp/yukari.so | grep -q 'zygisk_module_entry'
          ! readelf -Ws /tmp/yukari.so | grep -q 'zygisk_module_create'

      - name: Upload Yukari modules
        uses: actions/upload-artifact@v4
        with:
          name: Yukari-${{ github.sha }}
          path: |
            out/Yukari.zip
            out/Yukari-debug.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Yukari-native-diagnostics-${{ github.sha }}
          path: |
            module/build/outputs/
            module/build/intermediates/cxx/
            module/build/intermediates/stripped_native_libs/
          if-no-files-found: ignore
          retention-days: 7
