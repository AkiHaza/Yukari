name: Build Yukari Module

on:
  push:
    branches:
      - main
      - dev
      - Dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - dev
      - Dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yukari-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package arm64-v8a module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "${sdk_root}" || ! -d "${sdk_root}" ]]; then
            echo 'Android SDK root was not exported by setup-android' >&2
            exit 1
          fi
          export ANDROID_SDK_ROOT="${sdk_root}"
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "${GITHUB_ENV}"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;35.0.0' \
            'cmake;3.22.1' \
            'ndk;27.2.12479018'
          echo "ANDROID_SDK_ROOT=${sdk_root}"
          "$sdk_root/cmake/3.22.1/bin/cmake" --version
          "$sdk_root/ndk/27.2.12479018/ndk-build" --version | head -n 1

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Gradle entry point
        shell: bash
        run: |
          set -euo pipefail
          test -f gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Inject build version
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          run_number="${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_REF_NAME}" == "Dev" || "${GITHUB_REF_NAME}" == "dev" ]]; then
            version="1.0.0-dev (${run_number}-${short_sha})"
          else
            version="1.0.0 (${run_number}-${short_sha})"
          fi
          sed -i "s/^version=.*/version=${version}/" module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${run_number}/" module/module.prop
          echo "Ref: ${GITHUB_REF}"
          echo "Version: $(grep '^version=' module/module.prop)"
          echo "Version code: $(grep '^versionCode=' module/module.prop)"

      - name: Compile release APK/native library
        shell: bash
        run: |
          set -euo pipefail
          echo '[build] ./gradlew :module:assembleRelease'
          ./gradlew :module:assembleRelease --stacktrace --no-daemon

      - name: Package Magisk module
        shell: bash
        run: |
          set -euo pipefail
          echo '[package] bash scripts/package.sh'
          bash scripts/package.sh

      - name: Verify packaged module
        shell: bash
        run: |
          set -euo pipefail
          test -s out/Yukari.zip
          unzip -l out/Yukari.zip
          unzip -l out/Yukari.zip | grep -q 'module.prop'
          unzip -l out/Yukari.zip | grep -q 'zygisk/arm64-v8a.so'
          unzip -l out/Yukari.zip | grep -q 'action.sh'
          unzip -l out/Yukari.zip | grep -q 'customize.sh'
          unzip -p out/Yukari.zip module.prop | grep -q '^version='
          unzip -p out/Yukari.zip zygisk/arm64-v8a.so > /tmp/yukari.so
          readelf -Ws /tmp/yukari.so | grep -q 'zygisk_module_entry'
          ! readelf -Ws /tmp/yukari.so | grep -Eq ' (hook_ioctl|hook_transact_native|install_hooks)$'
          ! readelf -Ws /tmp/yukari.so | grep -q 'zygisk_module_create'
          echo '[verify] package and ELF checks passed'

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yukari-${{ github.run_id }}
          path: out/Yukari.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Yukari.zip
          generate_release_notes: true

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Yukari-diagnostics-${{ github.run_id }}
          path: |
            module/build/outputs/
            module/build/intermediates/cxx/
            module/build/intermediates/stripped_native_libs/
          if-no-files-found: ignore
          retention-days: 7
